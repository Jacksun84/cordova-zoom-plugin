buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Upgrade project Kotlin plugin so MABS uses a compiler capable of reading Kotlin 2.2 metadata
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21"
    }
}

// 1. Set Cordova project extensions explicitly so Cordova applies compileSdk to :app
ext.cdvCompileSdkVersion = 36
ext.cdvBuildToolsVersion = "36.0.0"
ext.cdvMinSdkVersion = 28
ext.cdvTargetSdkVersion = 36

ext.postBuildExtras = {
    android {
        compileSdkVersion 36
        buildToolsVersion "36.0.0"

        buildFeatures {
            viewBinding true
            compose true
        }

        defaultConfig {
            minSdkVersion 28
            targetSdkVersion 36
            multiDexEnabled true
            vectorDrawables.useSupportLibrary = true

            //Ensure build-android.gradle does not exclude target ABIs:
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            
        }

        buildTypes {
            release {
                minifyEnabled true
                proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            }
            debug {
                minifyEnabled false
                proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            }
        }

        // Align the Compose Compiler extension version for Kotlin 1.9.24
        composeOptions {
            kotlinCompilerExtensionVersion = "1.5.11"
        }

        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17

            // ***** D8 *****
            coreLibraryDesugaringEnabled true
        }
        packagingOptions {
            jniLibs {
                useLegacyPackaging = true
            }
            // Prevent duplicate file collisions from Zoom/Google dependencies
            resources {
                excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/COPYRIGHT',
                    'META-INF/COPYRIGHT.txt',
                    '**/*.kotlin_builtins',
                    '**/*.kotlin_module'
                ]
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://maven.google.com/'}
    maven { url "https://maven.pkg.jetbrains.space/public/p/compose/dev" }
    flatDir {
        dirs 'libs/android','libs', 'src/main/libs'
    }
    maven {
        url = uri("https://maven.pkg.github.com/Jacksun84/mobile-sdk-android")
        credentials {
            username = "Jacksun84"
            // Read from environment variable, fallback to project property
            password= System.getenv("ANDROID_ZOOM_SDK_PASSWORD") ?: (project.hasProperty("ANDROID_ZOOM_SDK_PASSWORD") ? project.ANDROID_ZOOM_SDK_PASSWORD : "")
        }
    }
}

// Targeted exclusions to mirror the Zoom sample lockfile behavior
configurations {
    runtimeClasspath {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-daemon-client'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-daemon-embeddable'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-compiler-embeddable'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-klib-commonizer-embeddable'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-build-tools-api'
    }
    implementation {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-daemon-client'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-daemon-embeddable'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-compiler-embeddable'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-klib-commonizer-embeddable'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-build-tools-api'
    }
}
// Global exclude rule to prevent duplicate class conflicts between protobuf-java and protobuf-javalite
configurations.all {
    resolutionStrategy {
        // Cache dynamic versions for 0 seconds
        cacheDynamicVersionsFor 0, 'seconds'
        // Cache changing modules (like updated AAR releases) for 0 seconds
        cacheChangingModulesFor 0, 'seconds'
    }
}

// Align Kotlin compilation to JVM 17 without throwing Groovy delegate property errors
tasks.matching { it.class.name.startsWith("org.jetbrains.kotlin.gradle.tasks.KotlinCompile") }.configureEach {
    kotlinOptions {
        jvmTarget = "17"
        // Force Kotlin compiler to allow Compose compilation with Kotlin 1.9.x
        freeCompilerArgs += [
            "-Xskip-metadata-version-check",
            "-P",
            "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=1.9.24"
        ]
    }
}

dependencies {
    implementation 'org.jetbrains:annotations:23.0.0'
    
    // ***** D8 *****
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Force changing flag so Gradle checks GitHub Packages every time
    implementation('com.jacksun:zoom-sdk-android:7.2.1.43944') {
        changing = true
