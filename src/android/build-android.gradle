//apply plugin: 'org.jetbrains.compose'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Upgrade Kotlin Gradle Plugin to support 2.x metadata
        classpath 'com.android.tools.build:gradle:8.10.0'
        classpath 'org.jetbrains.compose:compose-gradle-plugin:1.12.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.20'
    }
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 1. Generate proguard-rules.pro inside the app module if missing
def proguardFile = file("../app/proguard-rules.pro")
if (!proguardFile.exists()) {
    proguardFile.text = """
# Cordova Core Reflection Rules (Prevents "Failed to create webview" crash)
-keep class org.apache.cordova.** { *; }
-keep public class * extends org.apache.cordova.CordovaPlugin
-keep public class * extends org.apache.cordova.CordovaWebViewEngine
-keep public class org.apache.cordova.engine.SystemWebViewEngine {
    public <init>(android.content.Context, org.apache.cordova.CordovaPreferences);
}

# Zoom SDK Keep Rules
-keep class com.zipow.** { *; }
-keep class us.zoom.** { *; }
-keep class com.jacksun.** { *; }
-keep class cordova.plugin.zoom.** { *; }
-keep class  org.webrtc.**{*;}
-keep class  us.google.protobuf.**{*;}
-keep class  com.google.crypto.tink.**{*;}
-keep class  androidx.security.crypto.**{*;}
-keep class androidx.** {*;}
-keep class android.support.** {*;}
-keep class com.google.** { *; }

-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod

# Suppress Warnings
-dontwarn us.zoom.**
-dontwarn com.zipow.**
-dontwarn com.google.zxing.**
-dontwarn java.awt.**
-dontwarn javax.swing.**
-dontwarn kotlinx.coroutines.swing.**
-dontwarn io.reactivex.rxjava3.schedulers.Schedulers

-dontwarn com.android.**
-dontwarn com.google.**
-dontwarn com.microsoft.**
-dontwarn javax.lang.**
-dontwarn kotlin.jvm.internal.**
-dontwarn kotlinx.parcelize.**
-dontwarn org.**
-dontwarn xcrash.**
-dontwarn kotlin.uuid.ExperimentalUuidApi
-dontwarn kotlin.uuid.Uuid\\$Companion
-dontwarn kotlin.uuid.Uuid
"""
}

android {
    compileSdk = 36
    buildToolsVersion = "36.0.0"

    // Enable R8 / Code Shrinking [Enabling code shrinking (R8) forces AGP to pass a global synthetics consumer to D8, which resolves the Record desugaring conflict]
    defaultConfig {
        // Core library desugaring requires minSdkVersion 21+
        minSdkVersion 28
        multiDexEnabled true
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../app/proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../app/proguard-rules.pro'
        }
    }
    compileOptions {
        // Enable Java 8+ API desugaring
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // Set JVM target to match Java 17/11 compatibility
    kotlinOptions {
        jvmTarget = '11'
        freeCompilerArgs += ["-Xskip-metadata-version-check"] // Forces Kotlin compiler to ignore metadata mismatches
    }
    // end

    
    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'

        // Optional, try excluding the resource file
        // exclude 'res/xml/msdk_network_security_config.xml'
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}
repositories {
    jcenter()
    google()
    maven {
        url 'https://maven.google.com/'
        name 'Google'
    }
    flatDir {
        dirs 'libs/android'
    }
    maven {
        url = uri("https://maven.pkg.github.com/Jacksun84/mobile-sdk-android")
        credentials {
            username = "Jacksun84"
            password = "ANDROID_ZOOM_SDK_PASSWORD"
        }
    }
}

