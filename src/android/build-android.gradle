// Force 4GB heap size inside gradle.properties & disable aggressive R8 full mode
def gradlePropsFile = file("../gradle.properties")
if (gradlePropsFile.exists()) {
    def props = new Properties()
    gradlePropsFile.withInputStream { props.load(it) }
    props['org.gradle.jvmargs'] = '-Xmx4096m -XX:MaxMetaspaceSize=1024m'
    props['android.enableR8.fullMode'] = 'false'
    gradlePropsFile.withOutputStream { props.store(it, 'Updated JVM Args') }
}

// Global exclude rule to prevent duplicate class conflicts between protobuf-java and protobuf-javalite
configurations.all {
    exclude group: 'com.google.protobuf', module: 'protobuf-java'
}

// Generate the exact ProGuard rules file that AGP expects inside the app module directory
def proguardContent = """
# Cordova Core Reflection Rules (Prevents "Failed to create webview" crash)
-keep class org.apache.cordova.** { *; }
-keep public class * extends org.apache.cordova.CordovaPlugin
-keep public class * extends org.apache.cordova.CordovaWebViewEngine
-keep public class org.apache.cordova.engine.SystemWebViewEngine {
    public <init>(android.content.Context, org.apache.cordova.CordovaPreferences);
}

# Zoom SDK Keep Rules
-keep class com.zipow.** { *; }
-keep class us.zoom.** { *; }
-keep class com.jacksun.** { *; }
-keep class cordova.plugin.zoom.** { *; }
-keep class org.webrtc.** { *; }
-keep class us.google.protobuf.** { *; }
-keep class com.google.crypto.tink.** { *; }
-keep class androidx.security.crypto.** { *; }
-keep class androidx.** { *; }
-keep class android.support.** { *; }
-keep class com.google.** { *; }

-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod

# CRITICAL: Disable R8 optimization & obfuscation passes to eliminate OOM & Record desugaring errors
-dontoptimize
