dependencies {
    implementation 'com.jacksun:zoom-sdk-android:7.1.6.41900'

    //implementation 'com.outsystems.experts:zoom-sdk-android:6.3.10.27979'
    //implementation 'com.jacksun:zoom-sdk-android:6.3.10.27979'

    // Desugar JDK library version for API 36 / AGP 8+
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha05'
    implementation 'com.google.crypto.tink:tink-android:1.7.0'
    implementation 'com.google.android.exoplayer:exoplayer-core:2.17.1'
