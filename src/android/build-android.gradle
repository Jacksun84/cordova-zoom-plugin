"""

// Write rules to all possible locations so AGP and MABS find the rules file
file("../app/proguard-rules.pro").text = proguardContent
file("../app/proguard.cfg").text = proguardContent
file("proguard.cfg").text = proguardContent

android {
    compileSdk = 36
    buildToolsVersion = "36.0.0"

    // Enable R8 / Code Shrinking [Enabling code shrinking (R8) forces AGP to pass a global synthetics consumer to D8, which resolves the Record desugaring conflict]
    defaultConfig {
        // Core library desugaring requires minSdkVersion 21+
        minSdkVersion 28
        multiDexEnabled true
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), file("../app/proguard-rules.pro")
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), file("../app/proguard-rules.pro")
        }
    }
    compileOptions {
        // Enable Java 8+ API desugaring
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Set JVM target to match Java 17/11 compatibility
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xskip-metadata-version-check"] // Forces Kotlin compiler to ignore metadata mismatches
    }
    // end

    packagingOptions {
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        jniLibs {
            useLegacyPackaging = true
        }

        // Optional, try excluding the resource file
        // exclude 'res/xml/msdk_network_security_config.xml'
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}
repositories {
    google()
    mavenCentral()
    /*
    maven {
        url 'https://maven.google.com/'
        name 'Google'
    }*/
    flatDir {
        dirs 'libs/android'
    }
    maven {
        url = uri("https://maven.pkg.github.com/Jacksun84/mobile-sdk-android")
        credentials {
            username = "Jacksun84"
            password = "ANDROID_ZOOM_SDK_PASSWORD"
        }
    }
}

