repositories {
    google()
    mavenCentral()
    jcenter()
    maven { url 'https://maven.google.com/'}
    maven { url "https://maven.pkg.jetbrains.space/public/p/compose/dev" }
    flatDir {
        dirs 'libs/android','libs', 'src/main/libs'
    }
    maven {
        url = uri("https://maven.pkg.github.com/Jacksun84/mobile-sdk-android")
        credentials {
            // Pulls from environment variables on your machine or OutSystems MABS build server
            username = project.hasProperty("GITHUB_USERNAME") ? project.property("GITHUB_USERNAME") : System.getenv("GITHUB_USERNAME")
            // Falls back to system environment variable if the Cordova property is not provided
            password = project.hasProperty("GITHUB_TOKEN") ? project.property("GITHUB_TOKEN") : System.getenv("GITHUB_TOKEN")
        }
    }
}

// Global exclude rule to prevent duplicate class conflicts between protobuf-java and protobuf-javalite
configurations.all {
    exclude group: 'com.google.protobuf', module: 'protobuf-java'
}

