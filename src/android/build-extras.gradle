android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        // ***** D8 *****
        // coreLibraryDesugaringEnabled true

        kotlinOptions {
            jvmTarget = '17'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

// Bypass D8 isolated record desugaring by enabling multidex / full dexing options
// Fixed task hook syntax using string type name instead of direct class reference
afterEvaluate {
    tasks.matching { it.name.startsWith("dexBuilder") || it.name.startsWith("mergeExtDex") }.configureEach { task ->
        if (task.hasProperty("options")) {
            try {
                task.options.additionalParameters.add("--min-api=28")
            } catch (Exception e) {
                // Ignore if task options structure differs
            }
        }
    }
}